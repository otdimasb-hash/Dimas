<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Tenang Dimas</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-taman: #f4f7f5; /* Hijau muda yang sangat lembut/sage soft */
            --warna-daun: #556b2f; /* Hijau olive tua untuk teks utama */
            --warna-bunga: #e8d3cb; /* Warna pastel peach lembut */
            --putih-hangat: #ffffff;
            --teks-lembut: #4a5d4e;
            --bayangan-halus: 0 10px 30px rgba(85, 107, 47, 0.04);
            
            /* Warna badge transportasi versi sangat pastel */
            --krl-soft: #f5cd79;
            --mrt-soft: #78c2ad;
            --lrt-soft: #a8dadc;
            --tj-soft: #ffb7b2;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-taman);
            color: var(--warna-daun);
            margin: 0;
            padding: 24px;
            overflow-x: hidden;
        }

        .main-wrapper {
            max-width: 650px;
            margin: 40px auto;
        }

        /* --- HEADER SEPERTI JENDELA KAMAR SHO --- */
        .header-teduh {
            background-color: var(--putih-hangat);
            padding: 40px 20px;
            border-radius: 32px;
            text-align: center;
            box-shadow: var(--bayangan-halus);
            margin-bottom: 24px;
            border: 1px solid rgba(85, 107, 47, 0.08);
            position: relative;
        }

        .header-teduh h1 {
            font-family: 'Poppins', sans-serif;
            margin: 12px 0 0 0;
            font-size: 26px;
            color: var(--warna-daun);
            font-weight: 600;
            letter-spacing: -0.5px;
