    const apiKey = ""; // API Key otomatis disediakan oleh environment eksekusi jika ada

    async function fetchWithRetry(url, options, maxRetries = 5) {
      const delays = [1000, 2000, 4000, 8000, 16000]; // Exponential backoff
      for (let i = 0; i < maxRetries; i++) {
        try {
          const response = await fetch(url, options);
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          return await response.json();
        } catch (error) {
          if (i === maxRetries - 1) throw error;
          await new Promise(res => setTimeout(res, delays[i]));
        }
      }
    }

        <div style={{minHeight:"100vh",background:C.bg0,color:C.body,fontFamily:"Inter,sans-serif"}}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');
            @keyframes geser{from{transform:translateX(0)}to{transform:translateX(-50%)}}
            @keyframes kedip{0%,100%{opacity:1}50%{opacity:0.15}}
            *{box-sizing:border-box;margin:0;padding:0;}
          `}</style>

          <div style={{background:"linear-gradient(to right,#020810,#04111f,#020810)",borderBottom:`1px solid ${C.border}`,padding:"10px 18px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:32,height:32,borderRadius:8,background:`linear-gradient(135deg,${C.cyan},#0070a0)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>⬡</div>
              <div><div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:14,fontWeight:700,color:C.white}}>ALPHA COMMAND</div><div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:C.muted}}>Standalone HTML Version</div></div>
            </div>
            <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.muted}}>🕐 {jam.toLocaleTimeString("id-ID")}</div>
          </div>

          <TickerTape saham={saham} kripto={kripto}/>

          <div style={{maxWidth:1100,margin:"0 auto",padding:"16px 14px"}}>
            <div style={{display:"flex",gap:6,marginBottom:16}}>
              {TABS.map(t=>{
                const active=tab===t.id;
                return (
                  <button key={t.id} onClick={()=>setTab(t.id)} style={{ flex:1, padding:"11px 8px",borderRadius:12,cursor:"pointer",textAlign:"center", background:active?`linear-gradient(145deg,${C.cyan}18,${C.cyan}08)`:`${C.bg2}`, border:`1px solid ${active?C.cyan+"66":C.border}`, boxShadow:active?`0 0 20px ${C.cyanGlow}`:"none", transition:"all 0.22s" }}>
                    <div style={{fontSize:16,marginBottom:3}}>{t.icon}</div>
                    <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,fontWeight:700,color:active?C.cyan:C.muted}}>{t.label}</div>
                  </button>
                );
              })}
            </div>

            {tab==="saham"&&(
              <Card>
                <div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`}}><span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:C.muted}}>Saham AS</span></div>
                {saham.map(a=><BarisAset key={a.ticker} a={a} onAnalisis={a=>setModal(a)}/>)}
              </Card>
            )}

            {tab==="kripto"&&(
              <Card>
                <div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`}}><span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:C.muted}}>Kripto 24/7</span></div>
                {kripto.map(a=><BarisAset key={a.ticker} a={a} onAnalisis={a=>setModal(a)}/>)}
              </Card>
            )}

            {tab==="berita"&&(
               <Card style={{padding:16}}>
                 <SectionLabel icon="📰">Berita Pasar Live 24 Jam</SectionLabel>
                 <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {BERITA.map((b,i)=>(
                    <div key={i} style={{padding:"11px 14px",background:C.bg1,borderRadius:10,border:`1px solid ${b.dampak==="bullish"?C.green+"1a":C.red+"1a"}`}}>
                      <div style={{fontSize:12,color:C.bright,lineHeight:1.5,fontFamily:"Inter,sans-serif"}}>{b.judul}</div>
                      <div style={{marginTop:5,display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                        <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:C.muted}}>{b.waktu}</span>
                        <Pill color={C.cyan} size={8}>{b.kat}</Pill>
                        <Pill color={b.dampak==="bullish"?C.green:C.red} size={8}>{b.dampak==="bullish"?"▲ Bullish":"▼ Bearish"}</Pill>
                      </div>
                    </div>
                  ))}
                </div>
               </Card>
            )}
          </div>
          {modal&&<ModalAI aset={modal} tutup={()=>setModal(null)}/>}
        </div>
      );
    }

    // Melakukan Render ke dalam div id="root"
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
